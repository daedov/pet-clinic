name: codeql

on:
  push:
    branches:
      - main
      - feature-pipeline   # solo para validar la ejecución
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write 
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: 'maven'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Compilar con Maven # solo abarca src/main, los tests quedan fuera del análisis 
      run: ./mvnw -B -ntp clean compile

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
        output: sarif-results     # escribe el SARIF a disco
        upload: always            # y lo sigue publicando en Code scanning

    - name: Quality gate SAST # falla si hay medium o superior
      run: |
        SARIF=sarif-results/java.sarif
        THRESHOLD=4.0
        n=$(jq --argjson t "$THRESHOLD" '
          [ (.runs[].tool.driver.rules // []),
            (.runs[].tool.extensions[]?.rules // []) ] | add
          | map(select((.properties["security-severity"] // "0" | tonumber) >= $t) | .id) as $bad
          | [ .runs[].results[] | select(.ruleId as $id | $bad | index($id)) ] | length
        ' "$SARIF")
        echo "Hallazgos SAST con severidad >= Medium: $n"
        if [ "$n" -gt 0 ]; then
          echo "::error::Quality gate SAST: $n hallazgo(s) de severidad Medium o superior"
          exit 1
        fi
