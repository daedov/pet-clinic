name: codeql

on:
  push:
    branches:
      - main
      - feature-pipeline   # solo para validar la ejecución
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write 
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: Set up JDK 8
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: 'maven'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Compilar con Maven
      run: ./mvnw -B -ntp clean compile

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
      with:
        category: "/language:${{ matrix.language }}"
        output: sarif-results   
        upload: always           

    - name: Quality gate SAST
      run: |
        set -o pipefail
        shopt -s nullglob
        THRESHOLD=4.0
        total=0
        files=(sarif-results/*.sarif)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::No se encontro ningun SARIF en sarif-results/"
          exit 1
        fi
        for SARIF in "${files[@]}"; do
          n=$(jq --argjson t "$THRESHOLD" '
            [ .. | objects | select(.properties?."security-severity" != null)
              | select((.properties."security-severity" | tonumber) >= $t) | .id ] as $bad
            | [ .. | objects | select(.ruleId != null) | .ruleId
                | select(. as $x | ($bad | index($x)) != null) ]
            | length
          ' "$SARIF")
          echo "$SARIF: $n hallazgo(s) >= Medium"
          total=$((total + n))
        done
        echo "Hallazgos SAST con severidad >= Medium: $total"
        if [ "${total:-0}" -gt 0 ]; then
          echo "::error::Quality gate SAST: $total hallazgo(s) de severidad Medium o superior"
          exit 1
        fi
