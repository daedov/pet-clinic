name: codeql

on:
  push:
    branches:
      - main
      - feature-pipeline   # solo para validar la ejecución
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write 
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: 'maven'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Compilar con Maven # solo abarca src/main, los tests quedan fuera del análisis 
      run: ./mvnw -B -ntp clean compile

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
        output: sarif-results     # escribe el SARIF a disco
        upload: always            # y lo sigue publicando en Code scanning

    - name: Quality gate SAST # falla si hay medium o superior
      run: |
        set -o pipefail
        SARIF=$(ls sarif-results/*.sarif | head -1)
        echo "SARIF: $SARIF (raiz: $(jq -r type "$SARIF"))"
        THRESHOLD=4.0
        n=$(jq --argjson t "$THRESHOLD" '
          [ .. | objects | select(.properties?."security-severity" != null)
            | select((.properties."security-severity" | tonumber) >= $t) | .id ] as $bad
          | [ .. | objects | select(.ruleId != null) | .ruleId
              | select(. as $x | ($bad | index($x)) != null) ]
          | length
        ' "$SARIF")
        echo "Hallazgos SAST con severidad >= Medium: $n"
        if [ "${n:-0}" -gt 0 ]; then
          echo "::error::Quality gate SAST: $n hallazgo(s) de severidad Medium o superior"
          exit 1
        fi
