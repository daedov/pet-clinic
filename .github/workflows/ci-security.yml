name: ci-security

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
  schedule:
    - cron: '0 6 * * 1' 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Setup, Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: ./mvnw -B -ntp verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reportes-test
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Artifact 
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: build-and-test
    # TEMPORAL: desactivado para capturar la evidencia del gate en esta rama
    # if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write      

    steps:
      - name: Download build jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-jar
          path: app

      - name: OWASP Dependency-Check (quality gate)
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: spring-petclinic
          path: 'app'
          format: 'HTML'
          args: --enableRetired --format SARIF --failOnCVSS 4

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sca-report
          path: reports
          retention-days: 7

      - name: Upload SARIF to Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: sca

  dockerfile:
    name: Dockerfile audit (Trivy config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Trivy config (quality gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: sarif
          output: trivy-config-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy config SARIF to Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-config-results.sarif
          category: dockerfile

  image:
    name: Build & Security Image (Trivy)
    runs-on: ubuntu-latest
    needs: [build-and-test, sca]
    # TEMPORAL: desactivado para capturar la evidencia del gate en esta rama
    # if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download build jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-jar
          path: target

      - name: Build Docker image
        run: docker build -t spring-petclinic:${{ github.sha }} .

      - name: Trivy (quality gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: spring-petclinic:${{ github.sha }}
          scan-type: image
          vuln-type: 'os'
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF to Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif
          category: image
