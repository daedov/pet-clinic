name: ci-security

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main ]


permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: ./mvnw -B -ntp verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-test
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7


