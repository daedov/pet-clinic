name: ci-security

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main ]


permissions:
  contents: read

jobs:
  build-and-test:
    name: Setup, Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: ./mvnw -B -ntp verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-test
          path: target/surefire-reports/
          retention-days: 1

      - name: Upload Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write      

    steps:
      - name: Download build jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app

      - name: OWASP Dependency-Check (quality gate)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: spring-petclinic
          path: 'app'
          format: 'HTML'
          args: --enableRetired --format SARIF --failOnCVSS 4 --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: reports
          retention-days: 1

      - name: Upload SARIF to Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: sca

  image:
    name: Build & Security Image (Trivy)
    runs-on: ubuntu-latest
    needs: [build-and-test, sca]
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v5

      - name: Download build jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Build Docker image
        run: docker build -t spring-petclinic:${{ github.sha }} .

      - name: Trivy (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spring-petclinic:${{ github.sha }}
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy SARIF to Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: image

      - name: Trivy (table)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spring-petclinic:${{ github.sha }}
          scan-type: image
          format: table
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

